[package]
name = "fuzzy_tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
revm = { version = "36.0.0", default-features = false, features = ["std"] }
alloy-primitives = "1.6.0"
alloy-sol-types = "1.6.0"
taceo-poseidon2 = { version = "0.2.1", default-features = false, features = ["bn254", "t2", "t3"] }
ark-bn254 = { version = "0.5", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.5", default-features = false }
clap = { version = "4", features = ["derive"] }
rayon = "1"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
